; Program SENTRA Core (dimuat oleh /etc/supervisor/supervisord.conf).

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=/usr/bin/php /var/www/core/artisan queue:work --sleep=0.5 --tries=3 --max-time=3600
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/usr/bin/php /var/www/core/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:reverb]
command=/usr/bin/php /var/www/core/artisan reverb:start --host=0.0.0.0 --port=8080
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
